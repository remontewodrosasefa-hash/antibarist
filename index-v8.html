<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ecebe8">
<title>Antibarist · prototype v8</title>
<link rel="stylesheet" href="frameworks-frames/frames.css">
<script src="frameworks-frames/frames.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* black and white interface. the coffees, labels, Hoa and the real Frameworks mouldings (frameworks-frames/) keep their colour */
:root{
  --paper:#ecebe8; --bar:#f7f7f5; --ink:#111; --mute:#6d6d6a; --line:#cfcecb; --soft:#dcdbd7;
  --title:'Amatic SC',cursive; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --top:52px; --dock:52px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--paper);color:var(--ink);font:400 13px/1.55 var(--mono);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
a{color:inherit}
img{display:block;-webkit-user-drag:none;user-select:none}
.k{font:500 10.5px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--mute)}

/* top */
.top{position:fixed;inset:0 0 auto 0;height:calc(var(--top) + var(--sat));padding:var(--sat) 14px 0;display:flex;align-items:center;gap:12px;z-index:40;background:var(--bar);border-bottom:1.5px solid var(--ink)}
.logo{background:var(--ink);color:var(--bar);font:700 20px/1 var(--title);letter-spacing:2px;padding:5px 11px 3px;position:relative;flex:none}
.logo i{font-style:normal;font-size:10px;position:absolute;left:3px;top:1px}
.logo i+i{left:auto;top:auto;right:3px;bottom:0;transform:rotate(180deg)}
.status{white-space:nowrap;font-size:11px;line-height:1.25;color:var(--mute);display:flex;align-items:center;gap:7px}
.status .d{width:7px;height:7px;border-radius:50%;background:var(--ink);border:1.5px solid var(--ink);flex:none}
body.closed .status .d{background:transparent}
.status b{font-weight:500;color:var(--ink);display:block}
.sp{flex:1}
.here{font-size:11px;color:var(--mute);display:flex;align-items:center;gap:6px}
.here svg{width:22px;height:11px}
.tune{width:28px;height:28px;display:grid;place-items:center}

/* the map: one big wall you can move around in every direction */
.map{position:fixed;left:0;right:0;top:calc(var(--top) + var(--sat));bottom:calc(var(--dock) + var(--sab));overflow:scroll;scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-x pan-y;cursor:grab}
.map::-webkit-scrollbar{display:none}
.map.dragging{cursor:grabbing}
.map.dragging *{cursor:grabbing!important}
.world{position:relative;user-select:none;-webkit-user-select:none;margin:0 auto}
.it{position:absolute;cursor:pointer;transition:opacity .35s}
.it:focus{outline:none}
.it:focus-visible{outline:1.5px solid var(--ink);outline-offset:6px}
.world.filtering .it[data-r]:not(.on){opacity:.12}
.old{opacity:.5;filter:grayscale(1)}
.old:hover{opacity:.8}
.intro{cursor:default;text-align:center}
.intro p{font-size:12.5px;line-height:1.55;margin-top:8px}
.info{cursor:pointer}
@media (max-width:899px){.world .cap{font-size:12.5px}.intro p{font-size:15px}.intro .k{font-size:13px}.live b,.live span#lastMsg{font-size:12.5px}.block p,.hrs div{font-size:14px}.block .k{font-size:12.5px}}
.cap{font:500 10px/1.3 var(--mono);color:var(--ink);margin-top:9px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.cap span{display:block;color:var(--mute);text-transform:none;letter-spacing:.02em;font-weight:400}
.spec img{width:100%;mix-blend-mode:multiply}
.h-wall{font:700 42px/.9 var(--title);letter-spacing:.02em;cursor:default;text-align:center}
.q-mid{font:700 40px/1 var(--title);letter-spacing:.02em;text-align:center;cursor:default}
.h-wall .k{display:block;margin-bottom:6px}
.quote-big{font:700 38px/1.02 var(--title);letter-spacing:.02em;cursor:default}
.quote-big .k{display:block;margin-top:10px}

/* the centre: Hoa + the back room */
.hoa img{width:100%}
body.closed .hoa img{opacity:.28}
.hoa .off{display:none}
body.closed .hoa .on{display:none}
body.closed .hoa .off{display:block}
.door{background:var(--ink);height:205px;position:relative}
.door .bk{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:var(--bar);font:700 40px/.85 var(--title);letter-spacing:.04em}
.eyes{position:absolute;left:50%;top:62px;width:56px;height:30px;transform:translateX(-50%);display:flex;justify-content:space-between;align-items:center}
.eyes i{width:13px;height:9px;background:var(--bar);border-radius:50%;animation:blink 5.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.live{margin-top:9px;width:150px}
.live b{display:block;font:500 10px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.live b i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin-right:6px;vertical-align:1px;animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.live span#lastMsg{display:block;font:400 10px/1.3 var(--mono);color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.poster{background:var(--ink);color:var(--bar);padding:18px 18px 20px}
.poster .k{color:#a9a8a4}
.poster h3{font:700 46px/.88 var(--title);letter-spacing:.02em;margin:10px 0 12px}
.poster p{font-size:11px;line-height:1.5}
.block .t{font:700 30px/1 var(--title);letter-spacing:.02em;margin:6px 0 8px}
.block p{font-size:11.5px;line-height:1.55}
.block .u{display:inline-block;border-bottom:1px solid var(--ink);font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:12px 0 3px}
.hrs div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:5px 0;font-size:11.5px}
.idx .row{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:11.5px;width:100%}
.idx .row i{font-style:normal;color:var(--mute);width:20px;flex:none}
.idx .row span{flex:1}
.idx .row em{font-style:normal;color:var(--mute);font-size:10px}

/* visitor cats walk anywhere on the map */
.cat{position:absolute;width:58px;transform:translate(-50%,-100%);cursor:pointer;z-index:30}
.cat svg{width:100%;height:auto;overflow:visible;display:block}
.cat svg path{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.cat.you svg path{stroke-width:6.5}
.cat .flip{transform-box:fill-box;transform-origin:center}
.cat.right .flip{transform:scaleX(-1)}
.cat .lb,.cat .ls{display:none}
.cat.walk .la{animation:la .38s steps(1) infinite}
.cat.walk .lb{display:inline;animation:lb .38s steps(1) infinite}
@keyframes la{50%{opacity:0}}
@keyframes lb{0%{opacity:0}50%{opacity:1}}
.cat.sit .la{display:none}.cat.sit .ls{display:inline}
.cat .tail{transform-box:view-box;transform-origin:100px 31px;animation:tail 2.4s ease-in-out infinite}
@keyframes tail{50%{transform:rotate(-8deg)}}
.cat .nm{position:absolute;left:50%;top:100%;transform:translateX(-50%);font:500 10px/1 var(--mono);color:var(--ink);white-space:nowrap;letter-spacing:.04em;margin-top:2px;padding:2px 3px}
.cat.you .nm{background:var(--ink);color:var(--bar)}

.pop{position:absolute;z-index:50;background:var(--bar);border:1.5px solid var(--ink);padding:14px 16px 16px;width:250px;transform:translate(-50%,-100%);cursor:default}
.pop .t{font:700 28px/1 var(--title)}
.pop p{font-size:12px;line-height:1.45;color:var(--mute);margin:4px 0 12px}
.pop .k{margin-bottom:4px}
.pacts{display:flex;align-items:center;gap:16px}
.plink{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid var(--ink);padding-bottom:3px}
.pop input{font:400 14px var(--mono);border:0;border-bottom:1px solid var(--ink);width:100%;padding:6px 0;margin-bottom:12px;background:transparent;outline:0;color:var(--ink);user-select:text}
.pop .act{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;background:var(--ink);color:var(--bar);padding:10px 14px}

/* dock: region tabs + ask hoa, one row */
.dock{position:fixed;left:0;right:0;bottom:0;height:calc(var(--dock) + var(--sab));padding-bottom:var(--sab);z-index:40;background:var(--bar);border-top:1.5px solid var(--ink);display:flex}
.regions{flex:1;min-width:0;display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;padding:0 14px;align-items:center}
.regions::-webkit-scrollbar{display:none}
.rg{flex:none;font:500 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--mute);padding:5px 0;border-bottom:1.5px solid transparent}
.rg.on{color:var(--ink);border-color:var(--ink)}
.rg sup{font-size:9px;margin-left:2px}
.btn-ask{flex:none;background:var(--ink);color:var(--bar);font:700 25px/1 var(--title);letter-spacing:.06em;padding:3px 20px 0}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.16);opacity:0;pointer-events:none;transition:opacity .3s;z-index:55}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;height:88dvh;background:var(--bar);z-index:60;border-top:1.5px solid var(--ink);transform:translateY(102%);transition:transform .4s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column}
.sheet.open{transform:none}
.sheet.short{height:auto;max-height:88dvh}
.grab{flex:none;height:22px;display:flex;justify-content:center;align-items:center;touch-action:none;cursor:grab}
.grab i{width:34px;height:3px;background:var(--line);border-radius:2px}
.shead{flex:none;display:flex;align-items:flex-start;padding:2px 18px 14px;gap:12px}
.shead .t{flex:1;min-width:0}
.shead h2{font:700 44px/.95 var(--title);letter-spacing:.02em;margin-top:6px}
.shead .sub{color:var(--mute);margin-top:4px;font-size:12px}
.x{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--mute);padding:6px 0 6px 10px}
.sbody{flex:1;overflow-y:auto;padding:0 18px calc(28px + var(--sab))}
.sbody p{margin-bottom:12px}
.rule{height:1px;background:var(--line);margin:18px 0}
.labelimg{margin:0 0 18px;background:var(--soft);padding:22px}
.labelimg img{width:72%;margin:0 auto;mix-blend-mode:multiply}
.rows div{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.rows dt{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--mute);padding-top:2px}
.rows dd{text-align:right}
.tbc{border-bottom:1px dashed var(--ink)}
.char{font:700 30px/1.1 var(--title);letter-spacing:.03em;margin:4px 0 16px}
.quote{font:700 26px/1.15 var(--title);letter-spacing:.02em;margin:6px 0 16px}
.quote+.k{margin-top:-8px}
.recipe{display:grid;grid-template-columns:repeat(4,1fr);margin:8px 0 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.recipe div{padding:10px 0 9px;font:500 9.5px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--mute);text-align:center}
.recipe div+div{border-left:1px solid var(--line)}
.recipe b{display:block;font:700 30px/1.05 var(--title);color:var(--ink);letter-spacing:0}
.note-ph{font-size:10.5px;color:var(--mute);margin:8px 0 20px}
.primary{display:block;width:100%;background:var(--ink);color:var(--bar);font:500 11.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.14em;padding:16px;text-align:center;text-decoration:none}
.link{display:inline-block;font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;border-bottom:1px solid currentColor;padding:14px 0 3px;margin-top:4px;text-decoration:none}
.acts{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.acts .primary{margin-bottom:6px}

/* crate */
.filters{display:flex;gap:16px;margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
.crate{display:grid;grid-template-columns:1fr 1fr;gap:22px 14px}
.card .im{aspect-ratio:1;background:var(--soft) center/cover;margin-bottom:8px;box-shadow:inset 0 0 0 12px var(--soft),0 0 0 1.5px var(--ink)}
.card b{display:block;font:700 22px/1 var(--title);letter-spacing:.02em}
.card span{font-size:10.5px;color:var(--mute)}

/* events */
.ev{padding:4px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.ev h4{font:700 32px/.95 var(--title);margin:8px 0 8px;letter-spacing:.02em}
.hours{width:100%;border-collapse:collapse;margin-bottom:14px}
.hours td{padding:8px 0;border-bottom:1px solid var(--line)}
.hours td:last-child{text-align:right}
.hours tr.today td{font-weight:500;text-decoration:underline}

/* chat */
.topics{flex:none;display:flex;gap:16px;overflow-x:auto;padding:0 18px;border-bottom:1px solid var(--line);scrollbar-width:none}
.topics::-webkit-scrollbar{display:none}
.topic{flex:none;font:500 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--mute);padding:4px 0 10px;border-bottom:1px solid transparent;margin-bottom:-1px;white-space:nowrap}
.topic.on{color:var(--ink);border-color:var(--ink)}
.chat{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.m{max-width:86%}
.m .who{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--mute);margin-bottom:2px}
.m.h{padding-left:10px;border-left:2px solid var(--ink)}
.m.h .who{color:var(--ink)}
.m.me{align-self:flex-end;text-align:right}
.m.me .who{color:var(--ink)}
.sys{font-size:10.5px;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:12px}
.typing{font-size:11px;color:var(--mute)}
.compose{flex:none;display:flex;gap:12px;padding:10px 18px calc(12px + var(--sab));border-top:1px solid var(--line);align-items:center}
.compose input{flex:1;min-width:0;border:0;background:transparent;font:400 14px var(--mono);outline:0;padding:10px 0;color:var(--ink)}
.compose button{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.12em}
.locked{padding:40px 0;text-align:center}
.locked .quote{margin-bottom:8px}

/* ask hoa */
.hoa-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hoa-head img{width:54px;height:54px;object-fit:cover;object-position:50% 8%;border-radius:50%;background:var(--soft);border:1.5px solid var(--ink)}
.prog{display:flex;gap:4px;margin-bottom:18px}
.prog i{flex:1;height:2px;background:var(--line)}.prog i.on{background:var(--ink)}
.say{font:700 36px/1.02 var(--title);letter-spacing:.02em;margin-bottom:18px}
.opts button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.opts button:first-child{border-top:1px solid var(--line)}
.opts button::after{content:"→";color:var(--mute)}
.opts button:active{background:var(--soft)}
.pick{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%}
.pick .im{width:64px;height:64px;flex:none;background:var(--soft) center/cover;box-shadow:inset 0 0 0 6px var(--soft),0 0 0 1.5px var(--ink)}
.pick b{font:700 24px/1 var(--title);display:block;letter-spacing:.02em}
.pick span{font-size:11px;color:var(--mute)}

/* toast, demo */
.toast{position:fixed;left:14px;right:14px;top:calc(var(--top) + var(--sat) + 8px);z-index:90;background:var(--ink);color:var(--bar);font-size:11.5px;padding:10px 14px;opacity:0;transform:translateY(-6px);transition:.25s;pointer-events:none;text-align:center}
.toast.on{opacity:1;transform:none}
.demo{position:fixed;right:10px;top:calc(var(--top) + var(--sat) + 4px);z-index:45;background:var(--bar);border:1.5px solid var(--ink);padding:10px 14px;display:none;flex-direction:column;width:240px}
.demo.on{display:flex}
.demo button{padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.demo button:last-child{border:0}

@media (min-width:900px){
  .sheet{left:auto;right:0;top:calc(var(--top) + var(--sat));bottom:0;width:420px;height:auto;max-height:none;border-top:0;border-left:1.5px solid var(--ink);transform:translateX(102%)}
  .sheet.open{transform:none}
  .grab{display:none}
  .shead{padding-top:20px}
  .scrim{background:transparent}
  .toast{left:50%;right:auto;transform:translate(-50%,-6px);width:420px}
  .toast.on{transform:translate(-50%,0)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:899px){.live{width:160px}.live b,.live span#lastMsg{font-size:12.5px}}
</style>
</head>
<body>

<header class="top">
  <div class="logo"><i>A</i>ANTIBARIST<i>A</i></div>
  <div class="status"><span class="d"></span><div id="statusTxt"></div></div>
  <div class="sp"></div>
  <button class="here" id="hereBtn" aria-label="people here now"><svg viewBox="0 0 140 60"><path d="M8 36 L12 16 L18 27 L23 14 L27 28 L100 28 M100 28 L137 12 L134 18 L100 33 M8 36 L18 38 L14 52 L22 44 L24 54 L30 38 L84 34 L80 50 L88 42 L90 52 L100 33" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="hereN">0</span></button>
  <button class="tune" id="homeBtn" aria-label="back to the counter"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#111" stroke-width="1.5"><circle cx="10" cy="10" r="5.5"/><path d="M10 1v5M10 14v5M1 10h5M14 10h5"/></svg></button>
  <button class="tune" id="demoBtn" aria-label="demo controls"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round"><path d="M3 6h14M3 14h14"/><circle cx="7" cy="6" r="2" fill="#f7f7f5"/><circle cx="13" cy="14" r="2" fill="#f7f7f5"/></svg></button>
</header>

<div class="demo" id="demo">
  <span class="k" style="margin-bottom:4px">demo controls</span>
  <button data-d="in">someone opens the site</button>
  <button data-d="out">someone leaves</button>
  <button data-d="msg">fake Telegram message</button>
  <button data-d="open">switch open / closed</button>
</div>

<main class="map" id="map">
  <div class="world" id="world"></div>
</main>

<nav class="dock">
  <div class="regions" id="regions"></div>
  <button class="btn-ask" id="askBtn">ask hoa</button>
</nav>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-hidden="true">
  <div class="grab" id="grab"><i></i></div>
  <div class="shead"><div class="t" id="shead"></div><button class="x" id="sclose">close</button></div>
  <div id="sslot" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
</aside>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const map=$('map'),world=$('world'),sheet=$('sheet'),sslot=$('sslot');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ================= DATA ================= */
// labels Hoa sent. origin:null = still to confirm. short = name in the caption
const COFFEES={
  granja:{short:'granja',farm:'Granja Paraíso 92',producer:'Wilton Benitez',variety:'Orange Bourbon',process:'Fermentation washed',character:['silky','velvety','sirupy'],roaster:'liquid dream.',origin:'Colombia',region:'colombia'},
  nogales:{short:'los nogales',farm:'Los Nogales',producer:'Oscar Hernández',variety:'Bourbon Pimienta',process:'Anaerobic washed',character:['sparkling','juicy','complex'],roaster:'liquid dream.',origin:'Colombia',region:'colombia'},
  latorre:{short:'la torre',farm:'La Torre',producer:'Marleny Imbachi',variety:'Gesha',process:'Washed',character:['juicy','delicate','floral'],roaster:'liquid dream.',origin:null,region:'colombia'},
  girasol:{short:'girasol',farm:'El Girasol',producer:'Nicolas Medina',variety:'Pink Bourbon',process:'Washed',character:[],roaster:'SEY',origin:'Colombia',region:'colombia'},
  casita:{short:'casita',farm:'La Casita · Curtain Call',producer:'David Berrio',variety:'Chiroso',process:'Washed',character:[],roaster:'SEY',origin:'Colombia',region:'colombia'},
  diamante:{short:'diamante',farm:'El Diamante · Surprise Encore',producer:'Duber Mejia',variety:'Chiroso',process:'Washed',character:[],roaster:'SEY',origin:'Colombia',region:'colombia'},
  geshe:{short:'geshe',farm:'Geshe',producer:'',variety:'Ethiopian Landrace',process:'White honey',character:[],roaster:'SEY',origin:'Ethiopia',region:'ethiopia'},

/* ================= THE CANVAS =================
   one big canvas you move around on in every direction, built on an even grid of cells.
   centre (2 x 2 cells): what the site is, Hoa, the back room.
   ring 1 (the 12 cells around it): this week's coffees. ring 2: the info pieces + the archive. ring 3: older archive.
   the further out you go, the further back in time. */
const CW=230,CH=290,RINGS=3; // cell size, rings around the centre
const N=2*(RINGS+1);          // cells per side (8)
const PAD=260;                // empty space around the grid, for the cats
const WORLD={w:N*CW+2*PAD,h:N*CH+2*PAD};
const CX=WORLD.w/2,CY=WORLD.h/2;
const cellXY=(c,r)=>[CX+c*CW,CY+r*CH];        // top-left of cell (c,r); c, r run from -4 to 3
const ringOf=(c,r)=>Math.max(Math.abs(c+.5),Math.abs(r+.5))-.5;
// cells of one ring, clockwise from the top-left
function ring(k){
  const out=[],lo=-k-1,hi=k;
  for(let c=lo;c<=hi;c++)out.push([c,lo]);
  for(let r=lo+1;r<=hi;r++)out.push([hi,r]);
  for(let c=hi-1;c>=lo;c--)out.push([c,hi]);
  for(let r=hi-1;r>lo;r--)out.push([lo,r]);
  return out;
}

const INFO={'-1,-3':'event','0,-3':'about','-1,2':'hours','0,2':'counter','-3,-1':'crate','2,0':'telegram'};

function put(x,y,w,html,cls='',attrs){
  const el=document.createElement('div');
  el.className='it '+cls;el.style.cssText=`left:${x}px;top:${y}px;width:${w}px`;
  el.innerHTML=html;
  attrs&&Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));
  world.appendChild(el);return el;
}
const kbd=el=>{el.tabIndex=0;el.setAttribute('role','button');el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}});return el};

// centre a thing of width w inside cell (c,r); frames sit on the same line in every cell
const inCell=(c,r,w,top=34)=>{const [x,y]=cellXY(c,r);return [x+(CW-w)/2,y+top]};

  // ring 1: this week
  const r1=ring(1),left=r1.filter(([c])=>c<0),right=r1.filter(([c])=>c>=0);
  left.forEach(([c,r],i)=>nowFrame(NOW_LEFT[i],c,r));

function centerOn(x,y,smooth=true){
  map.scrollTo({left:x*Z-map.clientWidth/2,top:y*Z-map.clientHeight/2,behavior:smooth?'smooth':'auto'});
}
(()=>{let d=null,moved=false;
  map.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button||e.target.closest('.pop'))return;d={x:e.clientX,y:e.clientY,l:map.scrollLeft,t:map.scrollTop};moved=false});
  addEventListener('pointermove',e=>{if(!d)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;
    if(!moved&&Math.abs(dx)+Math.abs(dy)>5){moved=true;map.classList.add('dragging')}
    if(moved){map.scrollLeft=d.l-dx;map.scrollTop=d.t-dy}});
  addEventListener('pointerup',()=>{d=null;map.classList.remove('dragging')});
  map.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
})();

const Q=[
  {q:'how do you make coffee at home?',a:[['espresso machine','esp'],['filter: V60, Chemex, AeroPress','fil'],['moka pot','moka'],["I don't. I come here.",'any']]},
  {q:'what do you want to taste?',a:[['fruit. berries, citrus, juice','fruit'],['flowers. jasmine, tea','floral'],['sweet. chocolate, caramel','sweet'],['surprise me','any']]},
  {q:'how wild can it be?',a:[['keep it clean and classic','clean'],['a little funky is fine','funky1'],['the weirder the better','funky2']]},
  {q:'light like tea, or heavy and syrupy?',a:[['light','light'],['somewhere in between','mid'],['heavy','heavy']]}
];
function tags(c){
  const t=new Set(),w=c.character.join(' ');
  if(/juicy|vibrant|sparkling|winey|crisp/.test(w))t.add('fruit');
  if(/floral|delicate|elegant/.test(w))t.add('floral');
  if(/silky|velvety|smooth|sirupy/.test(w))t.add('sweet');
  if(/crisp|delicate|elegant|vibrant/.test(w))t.add('light');
  if(/sirupy|silky|winey|complex/.test(w))t.add('heavy');
  if(!c.character.length){ // no words on the label: go by variety
    if(/Gesha|Chiroso|Landrace/.test(c.variety)){t.add('floral');t.add('light')}
    if(/Pink Bourbon|Chiroso|Landrace/.test(c.variety))t.add('fruit');
  }
  const p=c.process.toLowerCase();
  t.add(/anaerobic|ferment/.test(p)?'funky2':/natural|honey/.test(p)?'funky1':'clean');
  return t;
}

  }
  if(step===Q.length)return askResult();
  const q=Q[step];
  openSheet(head('ask hoa',`question ${step+1} of ${Q.length}`),`<div class="sbody">${face}<div class="prog">${Q.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div><div class="say">${q.q}</div><div class="opts">${q.a.map(a=>`<button data-v="${a[1]}">${a[0]}</button>`).join('')}</div></div>`,{short:1});
  sslot.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{answers[step]=b.dataset.v;openAsk(step+1)});
}
function askResult(){
  const [brew,taste,wild,body]=answers;
  const scored=Object.entries(COFFEES).map(([id,c])=>{
    const t=tags(c);let s=Math.random()*.3;
    if(taste!=='any'&&t.has(taste))s+=3;
    if(t.has(wild))s+=2; else if(wild==='funky2'&&t.has('funky1'))s+=1;
    if(body==='light'&&t.has('light'))s+=1.5;
    if(body==='heavy'&&t.has('heavy'))s+=1.5;
    if(body==='mid'&&!t.has('light')&&!t.has('heavy'))s+=1;
    if((brew==='esp'||brew==='moka')&&(t.has('sweet')||t.has('heavy')))s+=1;
    if(brew==='fil'&&(t.has('floral')||t.has('light')))s+=1;
    return {id,c,s};
  }).sort((a,b)=>b.s-a.s);
  const top=scored[0],more=scored.slice(1,3);
  const why={fruit:'It tastes like fruit',floral:'It is light and flowery',sweet:'It is sweet and round',any:'It is one of my favourites right now'}[taste];
  const how={esp:'pull it as espresso',fil:'brew it as filter',moka:'it works on a moka pot',any:'come by and I make it for you'}[brew];
  const body2=`<div class="sbody">
    <div class="labelimg"><img src="img/${top.id}-label.jpg" alt=""></div>
    <div class="quote">"Try ${esc(top.c.farm)}. ${why}, and ${how}."</div><div class="k">Hoa</div>
    <div class="acts" style="margin:18px 0 22px"><button class="primary" id="seeTop">see this coffee</button><button class="link" id="talk">talk to Hoa about it</button></div>
    <div class="k" style="margin-bottom:4px">also try</div>
    ${more.map(m=>`<button class="pick" data-id="${m.id}"><div class="im" style="background-image:url(img/${m.id}-art.jpg)"></div><div><b>${esc(m.c.farm)}</b><span>${esc(m.c.variety)} · ${esc(m.c.process)}</span></div></button>`).join('')}
    <button class="link" id="again" style="margin-top:14px">ask again</button></div>`;
  openSheet(head('ask hoa','your coffee'),body2);
  $('seeTop').onclick=()=>openCoffee(top.id);$('again').onclick=()=>openAsk(0);
  $('talk').onclick=()=>openChat(`hey Hoa, you told me to try the ${top.c.farm}. `);
  sslot.querySelectorAll('.pick').forEach(b=>b.onclick=()=>openCoffee(b.dataset.id));
}

/* ================= CHAT ================= */
const TOPICS=[['Café Window',1],['Cupping Club'],['Brewing Recipes'],['Coffee Review'],['Beanexchange'],['Coffee Memes']];
let myName=null;
let log=[
  {sys:'the back room. coffee is better with company, so pull up a chair. this is the Café Window topic of the Antibarist Telegram group, messages go both ways.'},
  {who:'mila',t:'is the Granja Paraíso still there? it tasted like orange juice',at:'09:41'},
  {who:'Hoa',t:'yes, 3 bags left. come before saturday',at:'09:44',hoa:1},
  {who:'jonas',t:'who is going to brew your own cup on the 14th?',at:'10:12'},
  {who:'ece',t:'me. bringing my own grinder',at:'10:15'}
];
let unread=0;
const hm=()=>{const b=berlin();return String(b.h).padStart(2,'0')+':'+String(b.m).padStart(2,'0')};
const msgHTML=m=>m.sys?`<div class="sys">${esc(m.sys)}</div>`:`<div class="m ${m.hoa?'h':''} ${m.me?'me':''}"><div class="who">${esc(m.who)} · ${m.at}${m.me?' · sent':''}</div>${esc(m.t)}</div>`;
function openChat(prefill=''){
  unread=0;badge();
  const n=cats.filter(c=>!c.you).length;
  const body=`<div class="topics">${TOPICS.map((t,i)=>`<button class="topic ${i===0?'on':''}" data-i="${i}">${t[0]}</button>`).join('')}</div>
   <div class="chat" id="chat">${log.map(msgHTML).join('')}</div>
   <form class="compose" id="compose"><input id="cin" placeholder="write to Hoa and the group" autocomplete="off" enterkeyhint="send"><button>send</button></form>`;
  openSheet(head('live · linked to telegram','the back room',`Hoa + ${n} people here now`),body,{name:'chat'});
  $('chat').scrollTop=1e6;
  const cin=$('cin');cin.value=prefill;if(isDesk())setTimeout(()=>cin.focus(),400);
  $('compose').onsubmit=e=>{e.preventDefault();const v=cin.value.trim();if(!v)return;cin.value='';
    push({who:myName||'you',t:v,at:hm(),me:1});youCat&&youCat.say(v.length>18?v.slice(0,16)+'…':v);reply(v)};
  sslot.querySelectorAll('.topic').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;if(i===0)return openChat();
    sslot.querySelectorAll('.topic').forEach(x=>x.classList.toggle('on',x===b));
    $('chat').innerHTML=`<div class="locked"><div class="quote">${TOPICS[i][0]}</div><p style="color:var(--mute)">members only. this topic stays inside Telegram.</p><a class="primary" href="https://t.me/antibarist" target="_blank" rel="noopener" style="margin-top:18px">join 120 people on telegram</a></div>`;
    $('compose').style.display='none';
  });
}
function push(m){
  log.push(m);setLast();
  if(sheetName==='chat'&&$('chat')){$('chat').insertAdjacentHTML('beforeend',msgHTML(m));$('chat').scrollTop=1e6}
  else if(!m.me){unread++;badge()}
}
function badge(){$('chatTag').textContent=unread>0?`back room · ${unread} new`:'back room · live'}
function typing(name,ms,cb){
  setTimeout(()=>{if($('chat')){$('chat').insertAdjacentHTML('beforeend',`<div class="typing" id="typ">${name} is typing</div>`);$('chat').scrollTop=1e6}},600);
  setTimeout(()=>{$('typ')&&$('typ').remove();cb()},ms);
}
function reply(q){
  const s=q.toLowerCase(),at=(s.match(/@(\w+)/)||[])[1],mate=at&&cats.find(c=>c.name===at);
  if(mate){typing(mate.name,2600,()=>{push({who:mate.name,t:pick(['hey, nice to meet you here','hi! are you at Frameworks right now?','hello. have you tried the Granja Paraíso?']),at:hm()});mate.say('hi')});return}
  let a;
  if(/oat|milk|cow/.test(s))a='both work. but for the fruity ones, try it without milk first';
  else if(/open|hour|when|today|close/.test(s))a=berlin().open?'open right now, come by':'closed right now. tue to fri 8-16, sat 9-17';
  else if(/fruit|recommend|which|best|suggest|try/.test(s))a='fruity: Los Nogales. flowery: Las Flores. sweet: Granja Paraíso';
  else if(/brew|recipe|grind|v60|how/.test(s))a='15g coffee, 250g water, 93 degrees, around 2:45. then taste and adjust';
  else if(/cat|meow/.test(s))a='meow-meow is the real boss here';
  else if(/^(hi|hey|hello|hallo|moin|ciao)/.test(s))a='hey, welcome to the back room';
  else a='good question, give me a minute. or ask me at the counter';
  typing('Hoa',2600,()=>push({who:'Hoa',t:a,at:hm(),hoa:1}));
}
const RANDOM=[['mila','just got the SEY El Girasol, smells crazy'],['luca','cupping club next week?'],['Hoa','new on the wall: SEY Geshe from Ethiopia',1],['jonas','meow-meow is sleeping on my jacket again'],['Hoa','batch brew is ready',1]];
function randomMsg(){const r=pick(RANDOM);push({who:r[0],t:r[1],at:hm(),hoa:r[2]});if(sheetName!=='chat')toast('new message in the back room',1800)}
setInterval(()=>{if(Math.random()<.4)randomMsg()},32000);
$('askBtn').onclick=()=>openAsk();

/* ================= OPEN / CLOSED ================= */
function berlin(){
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Berlin',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  const day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday),h=+p.hour%24,m=+p.minute,t=h+m/60;
  let open=false,close=0;
  if(day>=2&&day<=5&&t>=8&&t<16){open=true;close=16}
  if(day===6&&t>=9&&t<17){open=true;close=17}
  return {day,h,m,open,close};
}
let forced=null;
const nextOpen=d=>(d===6||d===0||d===1)?'tue 8:00':(berlin().h<8?'today 8:00':'tomorrow 8:00');
function applyOpen(){
  const b=berlin(),open=forced===null?b.open:forced;
  document.body.classList.toggle('closed',!open);
  $('statusTxt').innerHTML=open?`<b>open</b>${forced===null?'till '+b.close+':00':'Hoa is in'}`:`<b>closed</b>back ${nextOpen(b.day)}`;
}
function toggleOpen(){forced=document.body.classList.contains('closed');applyOpen();toast(forced?'lights on · Hoa is in':'lights off · closed')}

/* ================= CATS ================= */
// every cat is a visitor. they walk anywhere on the wall. x, y = px in the wall (where the paws are)
const CAT=`<svg viewBox="0 0 140 60"><g class="flip">
 <path d="M8 36 L12 16 L18 27 L23 14 L27 28 L100 28"/>
 <g class="tail"><path d="M100 28 L137 10 L134 17 L100 33"/></g>
 <g class="la"><path d="M8 36 L18 38 L14 52 L22 44 L24 54 L30 38 L84 34 L80 50 L88 42 L90 52 L100 33"/></g>
 <g class="lb"><path d="M8 36 L18 38 L22 52 L25 44 L31 54 L33 38 L86 34 L93 50 L95 42 L99 52 L100 33"/></g>
 <g class="ls"><path d="M8 36 L18 38 L19 44 L32 44 L34 38 L84 34 L85 42 L98 42 L100 33"/></g>
</g></svg>`;
const clampX=x=>Math.max(40,Math.min(WORLD.w-40,x)),clampY=y=>Math.max(60,Math.min(WORLD.h-30,y));
let cats=[],youCat=null,popFor=null;
class Cat{
  constructor(o={}){
    this.you=!!o.you;const used=cats.map(c=>c.name);
    this.name=this.you?'you':(pick(NAMES.filter(n=>!used.includes(n)))||'guest');this.from=pick(FROM);
    this.x=o.x??(CX-300+Math.random()*600);this.y=o.y??(CY+175+Math.random()*60);
    this.el=document.createElement('button');this.el.className='cat sit'+(this.you?' you':'');
    this.el.innerHTML=CAT+`<span class="nm">${this.name}</span>`;
    this.el.onclick=e=>{e.stopPropagation();this.you?youPop():matePop(this)};
    world.appendChild(this.el);
    this.wait=1500+Math.random()*4000;this.target=null;this.speed=45+Math.random()*35;
    if(o.enter){ // walks in from the edge of what you can see
      const vx=map.scrollLeft/Z,vy=map.scrollTop/Z;
      this.x=vx-40;this.y=clampY(vy+map.clientHeight/Z*(.4+Math.random()*.4));
      this.go(vx+60+Math.random()*map.clientWidth/Z*.5,this.y);
    }
    this.place();
  }
  place(){this.el.style.left=this.x+'px';this.el.style.top=this.y+'px'}
  go(x,y){this.target={x,y};this.el.classList.remove('sit');this.el.classList.add('walk');this.el.classList.toggle('right',x>this.x)}
  say(t,ms=1800){const b=this.el.querySelector('.nm');b.textContent=t;clearTimeout(this.st);this.st=setTimeout(()=>b.textContent=this.you?(myName||'you'):this.name,ms)}
  tick(dt){
    if(this===popFor)return;
    if(!this.target){
      if(this.leaving){this.el.remove();cats=cats.filter(c=>c!==this);here();return}
      this.wait-=dt;if(this.wait<=0){
        // mostly stroll nearby, sometimes wander off to another wall
        if(Math.random()<.2)this.go(clampX(Math.random()*WORLD.w),clampY(Math.random()*WORLD.h));
        else this.go(clampX(this.x+(Math.random()-.5)*440),clampY(this.y+(Math.random()-.5)*260));
      }
      return;
    }
    const dx=this.target.x-this.x,dy=this.target.y-this.y,d=Math.hypot(dx,dy),st=this.speed*dt/1000;
    if(d<=st){this.x=this.target.x;this.y=this.target.y;this.target=null;this.el.classList.remove('walk');this.el.classList.add('sit');this.wait=(document.body.classList.contains('closed')?9000:4000)+Math.random()*7000}
    else{this.x+=dx/d*st;this.y+=dy/d*st}
    this.place();
  }
  leave(){this.leaving=true;this.go(this.x<WORLD.w/2?-60:WORLD.w+60,this.y)}
}
const here=()=>$('hereN').textContent=cats.length;
function addCat(o){const c=new Cat(o);cats.push(c);here();return c}

/* ================= POPUPS ================= */
let popEl=null;
function showPop(anchor,html,after){
  closePop();popEl=document.createElement('div');popEl.className='pop';popEl.innerHTML=html;popEl.onclick=e=>e.stopPropagation();map.appendChild(popEl);
  const mr=map.getBoundingClientRect(),wr={left:mr.left-map.scrollLeft,top:mr.top-map.scrollTop},r=anchor.getBoundingClientRect(),half=popEl.offsetWidth/2+10;
  const x=r.left+r.width/2-wr.left,minX=map.scrollLeft+half,maxX=map.scrollLeft+map.clientWidth-half;
  popEl.style.left=Math.max(minX,Math.min(maxX,x))+'px';
  popEl.style.top=Math.max(map.scrollTop+popEl.offsetHeight+12,r.top-wr.top-8)+'px';
  after&&after();
}
function closePop(){popEl&&popEl.remove();popEl=null;popFor=null}
map.addEventListener('click',closePop);
function matePop(c){
  showPop(c.el,`<div class="t">${c.name}</div><p>from ${c.from} · ${pick(['looking at the wall','in the back room','reading the labels','just walked in'])}</p><button class="act" id="hi">say hi</button>`,()=>{$('hi').onclick=()=>{closePop();openChat('@'+c.name+' ')}});
  popFor=c;c.el.classList.remove('walk');c.el.classList.add('sit');
}
function youPop(){
  showPop(youCat.el,`<div class="t">this is you</div><p>pick a name so people in the back room know who you are.</p><input id="nm" maxlength="14" placeholder="your name" value="${myName?esc(myName):''}"><button class="act" id="saveNm">save</button>`,()=>{
    $('saveNm').onclick=()=>{const v=$('nm').value.trim().toLowerCase().replace(/[^\p{L}\p{N}_]/gu,'').slice(0,14);if(v){myName=v;youCat.el.querySelector('.nm').textContent=v}closePop()};
  });
  popFor=youCat;
}

/* ================= BOOT ================= */
let last=performance.now();
function loop(t){const dt=Math.min(60,t-last);last=t;cats.forEach(c=>c.tick(dt));requestAnimationFrame(loop)}
$('demoBtn').onclick=e=>{e.stopPropagation();$('demo').classList.toggle('on')};
document.addEventListener('click',e=>{if(!$('demo').contains(e.target))$('demo').classList.remove('on')});
$('demo').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
  const d=b.dataset.d;
  if(d==='in'){const c=addCat({enter:true});toast(c.name+' opened the site')}
  if(d==='out'){const c=cats.find(c=>!c.you&&!c.leaving);if(c){c.leave();toast(c.name+' left')}}
  if(d==='msg')randomMsg();
  if(d==='open')toggleOpen();
  $('demo').classList.remove('on');
});
$('hereBtn').onclick=()=>{toast(`${cats.length} people on the site right now. tap a cat to say hi.`);youCat.say('this is you',2200)};
addEventListener('resize',()=>{setZoom()});
$('homeBtn').onclick=()=>{if(region!=='all')setRegion('all');else centerOn(...REGION_AT.all)};

function boot(){
  buildMap();regionCentres();setZoom();renderRegions();
  window.FrameworksFrames&&FrameworksFrames.scan();
  centerOn(...REGION_AT.all,false);
  youCat=addCat({you:true,x:CX-40,y:CY+190});
  const n=2+Math.floor(Math.random()*2);for(let i=0;i<n;i++)addCat();
  applyOpen();setInterval(applyOpen,60000);requestAnimationFrame(loop);
  setTimeout(()=>{unread=2;badge()},5000);
  setInterval(()=>{const r=Math.random();if(r<.25&&cats.length<6)addCat({enter:true});else if(r>.85&&cats.length>3){const c=cats.find(c=>!c.you&&!c.leaving&&c!==popFor);c&&c.leave()}},18000);
}
document.fonts?document.fonts.ready.then(boot):boot();
</script>
